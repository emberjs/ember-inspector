<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>EmberInspector Tests</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      /* Smoke and mirrors requires the container
      to be visible all the time since rendering
      deprends on visibility */
      #ember-testing-container {
        height: 400px;
        width: 1000px;
        zoom: 50%;
        position: fixed !important;
        right: 0;
        top: 200px;
        background: white;
      }
    </style>
  </head>
  <body class="theme-light">
    <div id="qunit"></div>
    <div id="qunit-fixture">
      <div id="ember-testing-container">
        <div id="ember-testing"></div>
      </div>
    </div>

    <script src="/testem.js" integrity="" data-embroider-ignore></script>
    <script type="module">
      import "ember-testing";
    </script>

    <script type="module">
      import { start } from "./test-helper";

      import.meta.glob("./**/*-test.{js,gjs}", { eager: true });
      start();
    </script>
  </body>
</html>
