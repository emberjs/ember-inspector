name: Workflow Lint

on:
  pull_request: {}
  push:
    branches:
      - main

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.8.1
        with:
          advanced-security: false
          # Workflow lockfiles are understood from zizmor 1.32.0.
          version: 1.32.0
          inputs: .github/
