name: Build and Publish
on:
  pull_request: {}
  push:
    branches:
      - main
      - stable
      - ember-2.7.0-3.4.0
      - ember-0.0.0-2.7.0
    tags:
      - v*
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - run: pnpm install
      - run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - run: pnpm install
      - name: Run tests
        run: pnpm test:ember

  test-watch:
    name: Test pnpm watch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - run: pnpm install
      - run: pnpm test:watch

  test-dists:
    name: Test the dist layout
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - run: pnpm install
      - run: pnpm test:dists

  test-e2e:
    name: End-to-end tests (${{ matrix.browser }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            os: ubuntu-latest
          - browser: firefox
            os: ubuntu-latest
          - browser: safari
            os: macos-latest
    env:
      CI: 'true'
      E2E_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - run: pnpm install
      # Ubuntu blocks the user namespaces that the Chrome sandbox needs.
      - if: matrix.browser == 'chrome'
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - if: matrix.browser == 'firefox'
        run: firefox --version
      # The bookmarklet opens the inspector in a popup.
      - if: matrix.browser == 'safari'
        run: |
          sudo safaridriver --enable
          defaults write com.apple.Safari WebKitJavaScriptCanOpenWindowsAutomatically -bool true
          defaults write com.apple.Safari com.apple.Safari.ContentPageGroupIdentifier.WebKit2JavaScriptCanOpenWindowsAutomatically -bool true
      - run: pnpm test:e2e:build
      - run: pnpm test:e2e
      - name: Upload screenshots of failed checks
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots-${{ matrix.browser }}
          path: tests/e2e/screenshots
          if-no-files-found: ignore

  build-ember-debug:
    name: Build ember-debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - run: pnpm install --ignore-scripts
      - run: pnpm build:ember-debug
      - name: Upload artifacts (ember-debug)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ember-debug
          path: packages/ember-debug/dist

  ember-try:
    name: ember-try (${{ matrix.scenario }})
    needs: build-ember-debug
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - ember-lts-3.16
          - ember-lts-3.20
          - ember-lts-3.24
          - ember-lts-3.28
          - ember-lts-4.8
          - ember-lts-4.12
          - ember-lts-5.4
          - ember-lts-5.8
          - ember-lts-5.12
          - ember-release
          - ember-beta
          - ember-canary

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      # The `prepare` script of ember-debug must not run. The build comes
      # from the build-ember-debug job.
      - run: pnpm install --ignore-scripts
      - name: Setup ember-try scenario
        working-directory: packages/ember-debug-tests
        run: pnpm exec ember try:one "$SCENARIO" --skip-cleanup --- cat package.json
        env:
          SCENARIO: ${{ matrix.scenario }}
      - name: Download artifacts (ember-debug)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ember-debug
          path: packages/ember-debug/dist
      - name: Run tests
        working-directory: packages/ember-debug-tests
        run: pnpm test

  ember-debug-wormhole:
    name: ember-debug with ember-wormhole
    needs: build-ember-debug
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - run: pnpm install --ignore-scripts
      - name: Download artifacts (ember-debug)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ember-debug
          path: packages/ember-debug/dist
      - name: Run tests
        working-directory: packages/ember-debug-wormhole-tests
        run: pnpm test

  ember-main:
    name: ember-source main (throw on deprecations)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - run: pnpm install
      - name: Install ember-source from main
        working-directory: packages/classic-test-app
        run: |
          pnpm exec ember-source-channel-url canary --write
          pnpm install --no-frozen-lockfile
      - name: Run tests
        working-directory: packages/classic-test-app
        run: pnpm test
        env:
          RAISE_ON_DEPRECATION: 'true'
      - name: Notify Discord
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        if: ${{ failure() && github.event_name == 'schedule' }}
        with:
          webhook: ${{ secrets.CORE_META_WEBHOOK }}
          status: 'Failure'
          title: 'Ember Inspector with ember-source main'
          color: 0xcc0000
          url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          username: GitHub Actions

  build:
    name: Build extensions
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - run: pnpm install
      - name: Download panes
        working-directory: packages/ember-inspector
        run: node scripts/download-panes.js
        env:
          EMBER_ENV: production
      - name: Update manifest.json (nightly)
        if: github.event_name == 'schedule'
        working-directory: packages/ember-inspector
        run: |
          DATE="$(date +"%Y.%-m.%-d")"
          SHA="${GITHUB_SHA:0:7}"
          VERSION="$(jq -r '.version' package.json)"
          CONTENT="$(cat "$FILE")"

          echo "$CONTENT" | jq --arg date "$DATE" --arg sha "$SHA" --arg version "$VERSION" "$FILTER" > $FILE
          cat "$FILE"
        env:
          FILE: skeletons/web-extension/manifest.json
          FILTER: >-
            .name += " (Nightly)" |
            .version = $date |
            .version_name = "\($version) (nightly build \($date) / \($sha))"
      - name: Update manifest.json (pull request)
        if: github.event_name == 'pull_request'
        working-directory: packages/ember-inspector
        run: |
          SHA="${SHA:0:7}"
          CONTENT="$(cat "$FILE")"

          echo "$CONTENT" | jq --arg pr "$PR" --arg sha "$SHA" "$FILTER" > $FILE
          cat "$FILE"
        env:
          FILE: skeletons/web-extension/manifest.json
          FILTER: >-
            .name += " (PR #\($pr))" |
            .version = $pr |
            .version_name = $sha
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
      - name: Update package.json (nightly)
        if: github.event_name == 'schedule'
        working-directory: packages/ember-inspector
        run: |
          DATE="$(date +"%Y.%-m.%-d")"
          SHA="${GITHUB_SHA:0:7}"
          CONTENT="$(cat "$FILE")"

          echo "$CONTENT" | jq --arg date "$DATE" --arg sha "$SHA" "$FILTER" > $FILE
          cat "$FILE"
        env:
          FILE: package.json
          FILTER: .version += "-alpha.\($date)+\($sha)"
      - name: Update package.json (pull request)
        if: github.event_name == 'pull_request'
        working-directory: packages/ember-inspector
        run: |
          SHA="${SHA:0:7}"
          CONTENT="$(cat "$FILE")"

          echo "$CONTENT" | jq --arg pr "$PR" --arg sha "$SHA" "$FILTER" > $FILE
          cat "$FILE"
        env:
          FILE: package.json
          FILTER: .version += "-alpha.0.\($pr)+\($sha)"
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
      - name: Set EMBER_INSPECTOR_TAB (nightly)
        if: github.event_name == 'schedule'
        run: echo "EMBER_INSPECTOR_TAB=Nightly" >> $GITHUB_ENV
      - name: Set EMBER_INSPECTOR_TAB (pull request)
        if: github.event_name == 'pull_request'
        run: echo "EMBER_INSPECTOR_TAB=PR \#$PR" >> $GITHUB_ENV
        env:
          PR: ${{ github.event.pull_request.number }}
      - name: Build
        run: pnpm build:production
      - name: Pack
        working-directory: packages/ember-inspector
        run: |
          VERSION="$(jq -r '.version' package.json)"

          pnpm pack
          mkdir -p dist/npm
          tar xvzf "ember-inspector-$VERSION.tgz" -C dist/npm --strip-components 1
      - name: Upload artifacts (bookmarklet)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bookmarklet
          path: packages/ember-inspector/dist/bookmarklet
      - name: Upload artifacts (Chrome)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome
          path: packages/ember-inspector/dist/chrome
      - name: Upload artifacts (Firefox)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firefox
          path: packages/ember-inspector/dist/firefox
      - name: Upload artifacts (npm)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm
          path: packages/ember-inspector/dist/npm

  publish-chrome:
    name: Publish Chrome extension
    needs:
      - test
      - ember-try
      - ember-debug-wormhole
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
      - name: Install dependencies (chrome-webstore-upload-cli)
        run: npm install -g chrome-webstore-upload-cli # zizmor: ignore[adhoc-packages] this job has no checkout and no lockfile
      - name: Download artifacts (Chrome)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chrome
          path: chrome
      - name: Set Environment Variables
        run: |
          echo "EXTENSION_ID=ibdbkmdgflhglikhjdbogjjflkialpfi" >> $GITHUB_ENV
          echo "CLIENT_ID=${{ secrets.GOOGLE_NIGHTLY_CLIENT_ID }}" >> $GITHUB_ENV
          echo "CLIENT_SECRET=${{ secrets.GOOGLE_NIGHTLY_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "REFRESH_TOKEN=${{ secrets.GOOGLE_NIGHTLY_REFRESH_TOKEN }}" >> $GITHUB_ENV
      - name: Upload to Chrome Web Store
        if: >-
          github.event_name == 'schedule'
        run: chrome-webstore-upload upload --source chrome --auto-publish
