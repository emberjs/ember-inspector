version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  open-pull-requests-limit: 10
  labels:
  - dependencies
  - internal
  ignore:
  - dependency-name: ember-cli
    versions:
    - ">= 0"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  open-pull-requests-limit: 10
  labels:
  - dependencies
  - internal
